name: Testy aplikacji
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testy logiki, danych i zasobów
        run: npm test
      - name: Sprawdzenie składni JavaScript
        run: find src scripts tests -name '*.js' -print0 | xargs -0 -n 1 node --check
